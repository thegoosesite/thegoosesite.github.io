<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none;
            user-select: none;
        }

        #jumpscare-img {
            cursor: none;
            user-select: none;
            -moz-user-select: none;
            display: none;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
        }

        /* Extreme shaking and zooming animation */
        @keyframes shakeAndZoom {
            0% { transform: translate(0, 0) scale(1); }
            10% { transform: translate(-10px, -15px) scale(1.1); }
            20% { transform: translate(15px, 5px) scale(1.2); }
            30% { transform: translate(-5px, 15px) scale(1.15); }
            40% { transform: translate(10px, -10px) scale(1.25); }
            50% { transform: translate(-15px, 10px) scale(1.2); }
            60% { transform: translate(15px, -5px) scale(1.3); }
            70% { transform: translate(-10px, 15px) scale(1.25); }
            80% { transform: translate(5px, -15px) scale(1.2); }
            90% { transform: translate(-15px, 5px) scale(1.15); }
            100% { transform: translate(0, 0) scale(1.3); }
        }

        .active {
            display: block !important;
            animation: shakeAndZoom 0.1s infinite alternate;
        }
    </style>
</head>
<body>
    <img id="jumpscare-img" src="/src/bin/secret/gooscare.jpg" alt="Jumpscare">
    <script>
        // Listen for the message from the parent script
        window.addEventListener('message', (event) => {
            if (event.data !== 'playAudio') return;

            // Get our elements and variables
            const img = document.querySelector('#jumpscare-img');
            let auxPath = "/src/bin/secret/jumpscare-audio.wav";

            // Setup HTML5 Audio
            const aux = new Audio(auxPath);
            aux.crossOrigin = 'anonymous';
            
            // Setup Audio Node processing for extreme volume boost
            const auxCtx = new (window.AudioContext || window.webkitAudioContext)();
            const auxSrc = auxCtx.createMediaElementSource(aux);
            const auxGainNode = auxCtx.createGain();
            
            auxGainNode.gain.value = 5.0; 
            auxSrc.connect(auxGainNode);
            auxGainNode.connect(auxCtx.destination);

            // Resume audio context and play audio safely
            auxCtx.resume().then(() => {
                // Show image and start shaking immediately
                aux.addEventListener('canplaythrough', function(){
                    img.classList.add('active');
                    aux.play().catch(e => console.log("Audio failed to play:", e));
                });
            });

            // Countdown to redirect or go back
            setTimeout(() => {
                aux.makePause = true; // Flag custom pause block if needed
                aux.pause();
                aux.currentTime = 0;
                
                if (document.referrer) {
                    window.location.href = document.referrer;
                } else {
                    window.history.back();
                }
            }, 2065);
        }, { once: true }); // Runs only once per iframe mount
    </script>

</body>
</html>
