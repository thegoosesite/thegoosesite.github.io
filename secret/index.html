<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none;
            user-select: none;
        }

        #jumpscare-img {
            cursor: none;
            user-select: none;
            -moz-user-select: none;
            display: none;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
        }

        /* Extreme shaking and zooming animation */
        @keyframes shakeAndZoom {
            0% { transform: translate(0, 0) scale(1); }
            10% { transform: translate(-10px, -15px) scale(1.1); }
            20% { transform: translate(15px, 5px) scale(1.2); }
            30% { transform: translate(-5px, 15px) scale(1.15); }
            40% { transform: translate(10px, -10px) scale(1.25); }
            50% { transform: translate(-15px, 10px) scale(1.2); }
            60% { transform: translate(15px, -5px) scale(1.3); }
            70% { transform: translate(-10px, 15px) scale(1.25); }
            80% { transform: translate(5px, -15px) scale(1.2); }
            90% { transform: translate(-15px, 5px) scale(1.15); }
            100% { transform: translate(0, 0) scale(1.3); }
        }

        .active {
            display: block !important;
            animation: shakeAndZoom 0.1s infinite alternate;
        }
    </style>
</head>
<body>
    <img id="jumpscare-img" src="/src/bin/secret/gooscare.jpg" alt="Jumpscare">
    <script>
        // Trigger the jumpscare on the first click anywhere on the page
        document.body.addEventListener('mouseenter', () => {
            // Get our variables
            const img = document.querySelector('#jumpscare-img');
            let auxPath = "/src/bin/secret/jumpscare-audio.wav";

            // Make audio & set volume abnormally high
            const aux = new Audio(auxPath);
            aux.crossOrigin = 'anonymous';
            const auxCtx = new (window.AudioContext || window.webkitAudioContext)();
            const auxSrc = auxCtx.createMediaElementSource(aux);
            const auxGainNode = auxCtx.createGain();
            auxGainNode.gain.value = 5.0; 
            auxSrc.connect(auxGainNode);
            auxGainNode.connect(auxCtx.destination);

            // Play audio instantly + Check for errors
            if (aux) {
                auxCtx.resume()
                aux.play().catch(e => console.log("Audio failed:", e));
            }
            // Reveal image and start shaking
            img.classList.add('active');
            
            // Listen for end (yay)
            setTimeout(() => {
                // Stop audio
                aux.pause()
                aux.currentTime = 0;

                // Send the user back to the page they were on before
                if (document.referrer) {
                    window.location.href = document.referrer;
                } else {
                    window.history.back();
                }
            }, 2065);
        }, { once: true });
    </script>

</body>
</html>
